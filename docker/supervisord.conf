; nginx, php-fpm and the queue worker that runs the deployments.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel scheduler: pk95:sync every minute (app status vs. containers).
[program:scheduler]
command=php /app/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Each worker activates one app at a time (pull, create, start, health check).
; Keep DB_QUEUE_RETRY_AFTER (Dockerfile, 1300) > --timeout (1200) > InstallApp timeout
; (pull 900 + health 120 + 120), otherwise a slow pull would run twice or be killed.
[program:queue]
command=php /app/artisan queue:work --sleep=1 --tries=1 --timeout=1200 --max-time=86400
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
