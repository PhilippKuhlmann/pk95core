# PK95 Uptime (~/code/Uptime): monitors, incidents, status pages.
# Image built by the Uptime repo's GitHub Actions; it needs the Core mode of app protocol v1.
id: uptime
name: PK95 Uptime
summary: Überwacht Dienste und Webseiten, meldet Ausfälle und liefert öffentliche Statusseiten.
image: ghcr.io/philippkuhlmann/pk95-uptime
tag: latest
port: 3001
icon: signal
module: uptime
health: /core/health
# Ping monitors: unprivileged ICMP sockets instead of NET_RAW (the app runs as user node).
# "0 65535" and not "0 2147483647": in an unprivileged LXC only 65536 group ids are mapped.
sysctls:
  net.ipv4.ping_group_range: "0 65535"
volumes:
  - name: data
    target: /data
# Public status pages: a second port of Uptime that serves only /status*, /api/public/status*
# and their assets. PK95 Proxy reaches it at <LAN-IP>:3002 (Linker::linkStatusPages); the
# admin API on 3001 stays inside the pk95 network.
ports:
  - "3002:3002"
env:
  DATA_DIR: /data
  RETENTION_DAYS: 90
  # Uptime's second port, only for the status pages (empty = off). PUBLIC_URL is not set: it is
  # Uptime's base for push URLs; the status pages' address is a Core setting for the links only.
  PUBLIC_PORT: 3002
