# PK95 DNS (repo pk95dns): network-wide DNS filter like AdGuard Home / Pi-hole with block
# lists, own rules, own DNS zones and records, blocked services, clients and query log. Image built by
# the pk95dns repo's GitHub Actions; it needs the Core mode of app protocol v1.
#
# Host network: DNS takes port 53 (UDP and TCP) of the LXC and sees the real client
# addresses (Docker NAT would hide them). The admin API listens on 8053 (8080 is Core).
# No capabilities needed: the app runs as root inside the container for port 53.
id: dns
name: PK95 DNS
summary: Filtert Werbung und Tracker für das ganze Netz und beantwortet eigene DNS-Zonen und -Einträge (A, AAAA, CNAME, MX, TXT, SRV, PTR). Mit Blocklisten, eigenen Regeln und Abfragelog. Belegt Port 53 des LXC.
image: ghcr.io/philippkuhlmann/pk95-dns
tag: latest
port: 8053
icon: shield
module: dns
health: /core/health
network_mode: host
volumes:
  - name: data
    target: /var/lib/pk95dns
env:
  PK95DNS_LISTEN: 0.0.0.0:8053
  PK95DNS_DATA_DIR: /var/lib/pk95dns
